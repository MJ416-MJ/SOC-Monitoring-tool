
services:
  db:
    image: mysql:8.0
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_bin
    environment:
      MYSQL_DATABASE: zabbix
      MYSQL_USER: zabbix
      MYSQL_PASSWORD: zbxpass
      MYSQL_ROOT_PASSWORD: rootpass
    volumes:
      - db-data:/var/lib/mysql
    restart: unless-stopped

  server:
    image: zabbix/zabbix-server-mysql:ubuntu-7.0-latest
    environment:
      DB_SERVER_HOST: db
      MYSQL_DATABASE: zabbix_repair
      MYSQL_USER: zabbix
      MYSQL_PASSWORD: zbxpass
    ports:
      - "10051:10051"
    depends_on:
      - db
    restart: unless-stopped

  web:
    image: zabbix/zabbix-web-nginx-mysql:ubuntu-7.0-latest
    environment:
      ZBX_SERVER_HOST: server
      DB_SERVER_HOST: db
      MYSQL_DATABASE: zabbix_repair
      MYSQL_USER: zabbix
      MYSQL_PASSWORD: zbxpass
      PHP_TZ: Africa/Nairobi
    ports:
      - "8080:8080"
    depends_on:
      - server
      - db
    restart: unless-stopped

volumes:
  db-data: {}
